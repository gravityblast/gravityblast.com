<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

    <title>{% if page.title %}{{ page.title }} - by {{ site.author }}{% else %}{{ site.author }}{% endif %}</title>
    <meta name="author" content="{{ site.author }}">

    <meta name="description" content="{{ site.meta_description}}" />

    <meta name="HandheldFriendly" content="True" />
    <meta name="MobileOptimized" content="320" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" type="text/css" href="/assets/css/screen.css" />
    <link rel="preload" href="/assets/fonts/web/source-serif-4-roman.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/web/inter.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Customisation  -->
    <link rel="stylesheet" type="text/css" href="/assets/css/main.css" />

    <link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="{{ "/feed.xml" | absolute_url }}" />

    <meta name="twitter:card" content="summary_large_image"></meta>
    <meta property="og:title" content="{{ page.title | default: site.title }}" />
    <meta property="og:url" content="{{ page.url | default: site.url | absolute_url }}" />
    <meta property="og:description" content="{{ page.excerpt | default: site.meta_description | strip_html | normalize_whitespace | truncate: 200 | escape }}" />
    <meta property="og:image" content="{{ page.share_image | default: page.cover | default: site.cover | absolute_url }}" />
    {% if jekyll.environment == "production" and site.google_analytics %}
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '{{ site.google_analytics }}');
    </script>
    {% endif %}
</head>
<body class="{{ page.post_class | default: layout.post_class | default: 'home-template' }}">

    {{ content }}
    <footer class="footer">
      <div class="footer-inner">
        <span>&copy; {{ site.time | date: "%Y" }} {{ site.author }}</span>
        <nav class="footer-links" aria-label="Elsewhere">
          <a href="/feed.xml">RSS</a>
          <a href="https://github.com/gravityblast">GitHub</a>
          <a href="https://x.com/gravityblast">X</a>
        </nav>
      </div>
    </footer>

    <script type="text/javascript" src="/assets/js/jquery-1.11.1.min.js"></script>
    <script type="text/javascript" src="/assets/js/jquery.fitvids.js"></script>
    <script type="text/javascript" src="/assets/js/index.js"></script>

</body>
</html>
