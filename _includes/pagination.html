<nav class="pagination" aria-label="Pagination">
    {% if paginator.previous_page %}
        {% if paginator.previous_page == 1 %}
            <a class="newer-posts" href="/" rel="prev">&larr; Newer</a>
        {% else %}
            <a class="newer-posts" href="/page{{ paginator.previous_page }}/" rel="prev">&larr; Newer</a>
        {% endif %}
    {% endif %}
    <span class="page-number">Page {{ paginator.page }} of {{ paginator.total_pages }}</span>
    {% if paginator.next_page %}
        <a class="older-posts" href="/page{{ paginator.next_page }}/" rel="next">Older &rarr;</a>
    {% endif %}
</nav>
