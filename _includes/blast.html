<!-- Blast, the site astronaut. Decorative; see assets/js/blast.js -->
<div class="blast-space" aria-hidden="true" hidden>
  <!-- the route: dotted path down the margin, solid where Blast has been -->
  <div class="blast-route">
    <i class="blast-route-done"></i>
    <svg class="blast-planet" viewBox="0 0 40 24" width="40" height="24">
      <ellipse cx="20" cy="13" rx="19" ry="4.5" class="blast-planet-ring"/>
      <circle cx="20" cy="12" r="9" class="blast-planet-ball"/>
      <path d="M11.4 14.2 a19 4.5 0 0 0 17.2 0" class="blast-planet-ring blast-planet-ring-front"/>
      <circle cx="17" cy="9" r="1.6" class="blast-planet-crater"/>
      <circle cx="23" cy="14" r="1.1" class="blast-planet-crater"/>
    </svg>
  </div>

  <div class="blast">
    <div class="blast-body">
      <svg class="blast-svg" viewBox="0 0 64 72" width="64" height="72">
        <defs>
          <linearGradient id="blast-visor" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#34506b"/>
            <stop offset="1" stop-color="#141e2a"/>
          </linearGradient>
        </defs>

        <!-- jetpack flames (blasting / celebrating) -->
        <g class="blast-flames">
          <path class="blast-flame" d="M19 50 q-3 7 0 13 q3 -6 0 -13z"/>
          <path class="blast-flame" d="M45 50 q-3 7 0 13 q3 -6 0 -13z"/>
        </g>

        <!-- boot thrusters (descending while you scroll down) -->
        <g class="blast-boots">
          <path class="blast-flame" d="M27 56 q-2.6 5 0 10 q2.6 -5 0 -10z"/>
          <path class="blast-flame" d="M37 56 q-2.6 5 0 10 q2.6 -5 0 -10z"/>
        </g>

        <!-- jetpack -->
        <rect x="15" y="31" width="34" height="19" rx="6" class="blast-pack"/>

        <!-- legs -->
        <rect x="23" y="46" width="8" height="11" rx="3.5" class="blast-suit"/>
        <rect x="33" y="46" width="8" height="11" rx="3.5" class="blast-suit"/>

        <!-- arms -->
        <g class="blast-arm blast-arm-left">
          <line x1="22" y1="37" x2="14" y2="45" class="blast-limb-outline"/>
          <line x1="22" y1="37" x2="14" y2="45" class="blast-limb"/>
        </g>
        <g class="blast-arm blast-arm-right">
          <line x1="42" y1="37" x2="50" y2="45" class="blast-limb-outline"/>
          <line x1="42" y1="37" x2="50" y2="45" class="blast-limb"/>
        </g>

        <!-- body + chest panel -->
        <rect x="20" y="32" width="24" height="19" rx="8" class="blast-suit"/>
        <rect x="27.5" y="37" width="9" height="7" rx="1.8" class="blast-panel"/>
        <circle cx="30.5" cy="40.5" r="1.3" class="blast-light"/>
        <circle cx="33.8" cy="40.5" r="1" class="blast-light-2"/>

        <!-- antenna -->
        <line x1="32" y1="8" x2="32" y2="3.5" class="blast-antenna"/>
        <circle cx="32" cy="3" r="1.8" class="blast-antenna-tip"/>

        <!-- helmet + visor -->
        <circle cx="32" cy="22" r="14" class="blast-suit"/>
        <rect x="20.5" y="15" width="23" height="14.5" rx="7.25" fill="url(#blast-visor)"/>
        <path d="M24 18.5 q3 -2.2 7 -2" class="blast-glint"/>

        <!-- eyes: open (blinking) / sleeping -->
        <g class="blast-eyes">
          <ellipse cx="28" cy="22.5" rx="1.7" ry="2.3"/>
          <ellipse cx="36" cy="22.5" rx="1.7" ry="2.3"/>
        </g>
        <g class="blast-eyes-closed">
          <path d="M26 23 q2 1.6 4 0"/>
          <path d="M34 23 q2 1.6 4 0"/>
        </g>

        <!-- headphones (listening) -->
        <g class="blast-headphones">
          <path d="M17 21 a15 15 0 0 1 30 0"/>
          <rect x="13.5" y="18" width="5.5" height="10" rx="2.4"/>
          <rect x="45" y="18" width="5.5" height="10" rx="2.4"/>
        </g>
      </svg>

      <span class="blast-note blast-note-1">&#9834;</span>
      <span class="blast-note blast-note-2">&#9835;</span>
      <span class="blast-zzz"><i>z</i><i>z</i><i>z</i></span>
      <span class="blast-stars"><i></i><i></i><i></i><i></i><i></i></span>
    </div>
    <span class="blast-tip"></span>
  </div>
</div>
<script src="/assets/js/blast.js" defer></script>
